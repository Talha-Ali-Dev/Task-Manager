<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="icon" type="image/x-icon" href="assets/icons/task-manager.jfif">
</head>

<body class="bg-[linear-gradient(135deg,#f0f0f0,#c0c0c0)]">
    <section class="flex flex-col justify-center items-center w-full h-screen">

        <div class="feature-card">

            <div class="flex justify-between items-center">

                <div>
                    <h1 class="font-bold text-2xl ">My Tasks</h1>
                    <p class="text-[#5C685F]">A simple task management app</p>
                </div>

                <div>
                    <img src="assets/icons/calendar (2).png" alt="">
                </div>

            </div>

            <div>
                <form id="task-form">
                    <div class="flex justify-between items-center">
                        <input type="text" id="task-input" placeholder="Enter a task" required
                            class="py-2 px-3 ring-1 ring-neutral-600 rounded-lg outline-[#5C685F]" />
                        <button type="submit"
                            class="px-3 py-2 bg-black text-white rounded-xl shadow-[0_8px_32px_rgba(0,0,0,0.1)]" id="submit-btn">Add
                            Task</button>
                    </div>
                </form>

            </div>

            <div class="flex justify-start items-center gap-4">

                <div class="py-1 px-2 text-xs bg-black text-white rounded-xl"><span
                        class="count-complete"></span> Completed</div>
                <div class="py-1 px-2 text-xs bg-black text-white rounded-xl"><span class="count-pending"></span> Pending
                </div>

            </div>

            <div class="tasks flex flex-col gap-4">

                <div class="flex justify-between items-center p-4 border border-neutral-600 rounded-xl" id="first-one">
                    <div class="flex justify-center items-center gap-4">

                        <div>
                            <input type="checkbox" class="size-4 accent-black taskCheckBox" data-target="first-one">
                        </div>

                        <div>
                            <h2 class="text-lg font-semibold">Build Sales Analytic Dashboard</h2>
                            <p class="text-[#5C685F] text-xs">Medium Priority</p>
                        </div>

                    </div>

                    <div>
                        <img src="assets/icons/trash.png" alt="" class="buz cursor-pointer" id="taskDel" data-target="first-one">
                    </div>
                </div>

            </div>

            <div>
                <p class="text-[#5C685F] text-xs">Interactive example: add, complete, delete, and filter tasks. Changes are temporary and reset when this example is refreshed.</p>
            </div>

        </div>

    </section>


    <script src="script.js"></script>
</body>

</html>
